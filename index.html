/*  ШЕРҚАЛА ІСІ — ДАЛАЛЫҚ МҰРАҒАТ
    Авторлық визуал бағыты: редакциялық типографика, карта, досье.
    Түрлі эмодзи, интерфейстік кітапханалар және сыртқы қаріптер жоқ. */
:root{
  --bg:#f4f1e9;--paper:#fffdf8;--ink:#1c302b;--ink-soft:#43564f;

  --sans:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --serif:"Noto Serif Display",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #bd924f;outline-offset:3px}button:disabled{cursor:not-allowed}.svg-sprite{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}.ui-icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.65;flex-shrink:0}.skip-link{position:fixed;top:-100px;left:20px;z-index:9999;padding:10px;background:white}.skip-link:focus{top:10px}
.shell{width:min(1240px,calc(100% - 72px));margin:0 auto}.site-header{min-height:91px;display:flex;align-items:center;gap:44px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}.brand-mark{display:block;width:41px;height:41px;border-radius:10px;overflow:hidden}.brand-type{display:flex;flex-direction:column;line-height:1.15;letter-spacing:.05em}.brand-type strong{font-size:15px;font-weight:800;letter-spacing:.05em}.brand-type small{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-top:5px}
.nav{display:flex;justify-content:center;gap:34px;flex:1;height:91px}.nav-item{border:0;background:transparent;color:var(--ink-soft);font-size:13px;font-weight:650;position:relative;padding:0;white-space:nowrap}.nav-item:hover,.nav-item.is-active{color:var(--ink)}.nav-item.is-active:after{content:"";position:absolute;left:0;right:0;bottom:26px;height:2px;background:var(--ink)}.header-progress{font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--ink-soft);border-left:1px solid var(--line);padding-left:20px;white-space:nowrap}.main{padding-bottom:100px;min-height:75vh}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:23px 0 34px;font-size:11px;font-weight:600;color:var(--muted)}.site-footer>span:first-child{color:var(--ink);font-weight:850;letter-spacing:.08em}.foot-slash{color:#a28b71;padding:0 9px}
/* shared editorial language */
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--ochre);font-size:10px;font-weight:850;letter-spacing:.17em;text-transform:uppercase;line-height:1.4}.eyebrow-line{display:inline-block;height:1px;width:27px;background:currentColor}.eyebrow-split{opacity:.45}.eyebrow-plain{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--ochre)}h1,h2,h3,p{margin-top:0}h1,h2,h3{letter-spacing:-.045em}h1,h2{font-weight:700}h1{font-size:clamp(37px,5vw,74px);line-height:1.12}h2{font-size:clamp(28px,3.2vw,45px);line-height:1.2}p{color:var(--ink-soft)}em{font-family:var(--serif);font-weight:500;font-style:italic}
.button{border:none;display:inline-flex;align-items:center;justify-content:space-between;gap:20px;background:var(--green);color:var(--paper);padding:15px 21px;min-height:52px;font-size:13px;font-weight:800;text-decoration:none;border-radius:3px;transition:background .2s,transform .2s;letter-spacing:.005em}.button:hover{background:#286657;transform:translateY(-1px)}.button .ui-icon{width:18px;height:18px}.button-secondary{background:transparent;color:var(--ink);border:1px solid #bac5b9}.button-secondary:hover{background:#eaece4}.button-row{display:flex;flex-wrap:wrap;gap:11px}.text-button,.back-link,.hero-text-link{border:0;background:transparent;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:9px;padding:11px 0}.text-button:hover,.back-link:hover,.hero-text-link:hover{color:var(--success)}
/* Landing - asymmetric layout & strong single art */
.hero{display:grid;grid-template-columns:1.04fr .96fr;min-height:485px;margin-top:28px;overflow:hidden;box-shadow:var(--shadow)}.hero-copy{background:var(--green);color:white;padding:61px 60px 35px;display:flex;flex-direction:column;align-items:flex-start}.hero-meta{display:flex;gap:10px;align-items:center;font-weight:750;font-size:10px;letter-spacing:.15em;color:#d9dcbf}.hero-meta-dot{width:6px;height:6px;background:var(--gold);border-radius:50%}.hero h1{margin:34px 0 24px;font-size:clamp(43px,5vw,69px);letter-spacing:-.057em;max-width:540px}.hero h1 em{color:var(--gold);font-style:italic;font-weight:450;white-space:nowrap}.hero-lead{font-size:16px;line-height:1.85;color:#cedcd1;max-width:465px;margin:0 0 31px}.hero-actions{display:flex;align-items:center;gap:26px;flex-wrap:wrap}.hero-actions .button{background:var(--gold);color:var(--green-deep)}.hero-actions .button:hover{background:#f3d9a7}.hero-text-link{color:#e4e6d6;font-size:13px}.hero-text-link:hover{color:white}.hero-text-link .ui-icon{width:16px}.hero-bottom{margin-top:auto;padding-top:36px;color:#9aaf9e;font-size:10px;letter-spacing:.15em;font-weight:750}.hero-bottom span{color:var(--gold);padding:0 8px}
.hero-art{background:#d9d2ba;position:relative;overflow:hidden}.art-landscape{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art-index{position:absolute;left:32px;top:25px;right:32px;display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--green);gap:20px}.art-index b{border:1px solid rgba(23,57,48,.48);font-size:10px;padding:7px 10px}.art-caption{position:absolute;left:28px;bottom:28px;right:28px;display:flex;align-items:center;gap:15px;padding:18px 20px;background:rgba(255,253,248,.94);backdrop-filter:blur(8px);box-shadow:0 6px 25px #283f3612}.caption-rule{display:block;width:3px;height:43px;background:var(--ochre)}.art-caption>div{flex:1}.art-caption strong,.art-caption small{display:block}.art-caption strong{font-size:16px;color:var(--ink)}.art-caption small{font-size:10px;color:var(--muted);margin-top:2px}.art-caption .ui-icon{color:var(--ochre);width:23px;height:23px}
.info-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);border-left:1px solid var(--line);border-right:1px solid var(--line);background:#faf9f4}.info-strip>div{display:flex;align-items:center;justify-content:center;gap:13px;padding:22px 10px;border-right:1px solid var(--line)}.info-strip>div:last-child{border-right:0}.info-strip strong{font:600 31px/1 var(--serif);letter-spacing:-.04em;color:var(--ink)}.info-strip span{font-size:12px;font-weight:600;color:var(--muted)}.info-strip .ui-icon{width:23px;height:23px;color:var(--ochre)}
.editorial-section{display:grid;grid-template-columns:330px minmax(0,1fr);gap:65px;padding:93px 0 87px}.section-intro h2{font-size:43px;line-height:1.1;margin:22px 0 24px}.section-intro p{font-size:14px;line-height:1.9;max-width:300px}.chapter-list{border-top:1px solid var(--line)}.chapter-row{display:grid;grid-template-columns:38px 47px minmax(0,1fr) auto 20px;gap:17px;align-items:center;padding:21px 14px 21px 8px;border-bottom:1px solid var(--line);min-height:111px;transition:background .2s}.chapter-row:hover{background:#ecece3}.chapter-index{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--ochre);align-self:start;margin-top:10px}.chapter-icon{border:1px solid #c8d3ca;background:#e9ede5;width:45px;height:45px;display:grid;place-items:center;color:var(--green)}.chapter-icon .ui-icon{width:22px;height:22px}.chapter-info h3{font-size:18px;letter-spacing:-.026em;margin-bottom:1px}.chapter-info p{font-size:12px;margin-bottom:0;color:var(--muted)}.chapter-count{font-size:10px;color:var(--ochre);font-weight:850;white-space:nowrap}.chapter-complete .chapter-count{color:var(--success)}.chapter-arrow{width:16px;color:var(--muted)}
.rules-section{border-top:1px solid var(--line);padding:55px 0 10px}.rules-heading h2{margin:18px 0 35px;font-size:33px}.rule-steps{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.rule-steps>div{padding:28px 33px 25px 0;position:relative;border-right:1px solid var(--line)}.rule-steps>div+div{padding-left:33px}.rule-steps>div:last-child{border-right:none}.step-index{font-size:10px;font-weight:850;color:var(--ochre);letter-spacing:.15em}.rule-steps .ui-icon{width:26px;height:26px;color:var(--green);margin:0 0 -7px 22px;vertical-align:middle}.rule-steps h3{font-size:18px;margin:18px 0 4px}.rule-steps p{font-size:12px;margin:0;max-width:240px}.fine-note{display:flex;align-items:flex-start;gap:13px;padding:22px 23px;background:#e8eae2;color:var(--ink-soft);font-size:12px;line-height:1.75;margin-top:28px}.fine-note .ui-icon{width:18px;height:18px;color:var(--ochre);margin-top:2px}.fine-note strong{color:var(--ink)}

.intro-page{border:1px solid var(--line);background:var(--paper);margin:43px auto 0;max-width:870px;min-height:620px;position:relative;padding:43px 80px;display:flex;align-items:flex-start;flex-direction:column}.intro-index{display:flex;justify-content:space-between;width:100%;border-bottom:1px solid var(--line);padding-bottom:20px;color:var(--muted);font-size:11px;letter-spacing:.11em;font-weight:750}.intro-symbol{height:140px;width:140px;display:grid;place-items:center;background:#edf1e8;border-radius:50%;margin:31px 0 26px;color:var(--green);border:1px solid #d8dfd0}.intro-symbol .ui-icon{width:63px;height:63px;stroke-width:1.2}.intro-page h1{font-size:60px;margin:16px 0 16px}.intro-page>p{max-width:550px;font-size:16px;line-height:1.8;margin-bottom:27px}.intro-footnote{margin:auto 0 0;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-top:24px}

.progress-segments{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:8px}.progress-segments span{height:5px;background:#d9ddd3}.progress-segments .progress-filled{background:var(--green)}.progress-segments .progress-current{background:var(--ochre)}.progress-line{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.13em;color:var(--muted);font-weight:800;padding:12px 0 27px}
.investigation-grid{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(335px,.76fr);gap:20px;align-items:start}
.dossier{background:var(--paper);border:1px solid var(--line);min-width:0;padding:36px 39px 39px;box-shadow:var(--shadow)}.dossier-header,.dossier-header>div{display:flex;align-items:center;justify-content:space-between;gap:10px}.dossier-header{border-bottom:1px solid var(--line);padding-bottom:17px}.dossier-tab,.dossier-id,.category-tag{font-size:10px;letter-spacing:.14em;font-weight:800}.dossier-tab{color:var(--ochre)}.dossier-id{color:var(--muted)}.category-tag{border:1px solid #c9d4c9;background:#f0f3eb;padding:8px 12px;white-space:nowrap;color:var(--ink-soft)}.dossier h2{font-size:38px;font-family:var(--serif);font-weight:600;letter-spacing:-.055em;margin:28px 0 28px}.claim-title{font-size:10px;letter-spacing:.15em;font-weight:850;color:var(--muted);margin-bottom:10px}.claim{margin:0 0 20px;padding:23px 28px 26px;background:#f1e8d9;position:relative;border-left:3px solid #bf8f54}.claim-quote{font:italic 44px/1 var(--serif);color:#b69772;position:absolute;top:7px;left:14px}.claim p{margin:0 0 0 8px;font:500 clamp(18px,2.2vw,25px)/1.55 var(--serif);color:var(--ink)}.case-tip{display:flex;gap:12px;align-items:flex-start;color:var(--ink-soft);line-height:1.7;font-size:13px;margin-bottom:34px}.case-tip .ui-icon{margin-top:1px;color:var(--ochre)}.case-tip strong{color:var(--ink)}
.documents-title{display:flex;justify-content:space-between;align-items:center;gap:9px;border-top:1px solid var(--line);padding-top:24px;margin-bottom:14px}.documents-title>div{display:flex;align-items:center;gap:12px}.documents-title .ui-icon{width:20px;color:var(--green)}.documents-title h3{font-size:20px;margin:0}.documents-title>span{font-size:11px;color:var(--muted);font-weight:700}.documents{display:grid;gap:9px}.evidence-item{background:white;border:1px solid #dcded5;transition:border .15s}.evidence-item.is-open{border-color:#9fae9e}.evidence-button{border:0;width:100%;display:flex;align-items:center;gap:12px;background:none;color:var(--ink);text-align:left;padding:17px 16px}.evidence-button:hover{background:#f4f6ef}.doc-mark{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;background:#ecf0e8;color:var(--green)}.doc-mark .ui-icon{width:17px;height:17px}.evidence-name{font-size:13px;font-weight:700;flex:1;line-height:1.45}.doc-action{font-size:11px;color:var(--muted);font-weight:700}.evidence-chevron{width:16px;height:16px;transition:transform .2s}.is-open .evidence-chevron{transform:rotate(180deg)}.evidence-body{padding:2px 22px 23px 62px;color:var(--ink-soft);line-height:1.8}.evidence-body[hidden]{display:none}.evidence-body p{font-size:13px;margin-bottom:12px}.evidence-body a{font-size:12px;color:var(--green);font-weight:800;text-underline-offset:4px;display:inline-flex;gap:6px;align-items:center}.evidence-body a .ui-icon{width:13px;height:13px}.documents-help{display:flex;gap:11px;align-items:flex-start;font-size:12px;color:var(--muted);padding:20px 0 0;line-height:1.7}.documents-help .ui-icon{width:17px;height:17px;color:var(--ochre);margin-top:2px}
.decision{background:#e8ebdf;border:1px solid #cdd5c8;padding:29px 25px;position:sticky;top:20px}.decision-head{display:flex;gap:14px;align-items:center}.decision-icon{background:var(--green);color:white;display:grid;place-items:center;width:48px;height:48px;flex-shrink:0}.decision-icon .ui-icon{width:24px;height:24px}.decision h3{font-size:18px;letter-spacing:-.028em;line-height:1.35;margin:4px 0 0}.decision-lead{font-size:13px;line-height:1.75;margin:19px 0 22px}.verdicts{display:grid;gap:9px}.verdict-btn{display:flex;gap:12px;align-items:center;border:1px solid #cdd5c8;background:var(--paper);padding:13px 13px;width:100%;text-align:left;color:var(--ink);transition:border .15s,background .15s,transform .15s;min-height:73px}.verdict-btn:not(:disabled):hover{border-color:var(--green);transform:translateX(2px);background:#fff}.verdict-btn:disabled{opacity:.59}.verdict-btn.is-chosen{opacity:1!important;border-color:var(--green);background:#f6f9ef}.verdict-symbol{display:grid;place-items:center;flex-shrink:0;width:39px;height:39px;background:#f0f1e8;color:var(--green)}.verdict-symbol .ui-icon{width:20px;height:20px}.verdict-legend .verdict-symbol{background:#f6e9d6;color:#996d3c}.verdict-doubt .verdict-symbol{background:#f4eae5;color:#a45a44}.verdict-copy{flex:1}.verdict-copy strong{display:block;font-size:14px}.verdict-copy small{display:block;font-size:11px;color:var(--muted);font-weight:450;margin-top:2px}.verdict-arrow{width:16px;color:#8d9c8f}.decision-status{display:flex;align-items:flex-start;gap:9px;padding:19px 1px;color:var(--muted);font-size:12px;line-height:1.6}.decision-status .ui-icon{width:16px;height:16px;margin-top:2px}.decision-status.is-ready{color:var(--success);font-weight:700}.decision-points{border-top:1px solid #c6d1c3;padding-top:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}.decision-points span{font-size:10px;letter-spacing:.09em;color:var(--muted);font-weight:800}.decision-points strong{font-size:13px;color:var(--ink)}
.feedback{margin:22px 0 0;border:1px solid #becfc0;padding:31px;display:flex;gap:23px;background:#edf2e8}.feedback.bad{background:#f4eee7;border-color:#dec5b6}.feedback-symbol{flex-shrink:0;background:var(--success);color:white;width:50px;height:50px;display:grid;place-items:center}.feedback.bad .feedback-symbol{background:var(--ochre)}.feedback-symbol .ui-icon{width:27px;height:27px}.feedback-content{flex:1}.feedback h2{font-size:30px;margin:14px 0}.feedback-result{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:15px}.feedback-result strong{color:var(--green)}.feedback-result span{font-weight:800;color:var(--ochre)}.feedback-content>p{font-size:14px;line-height:1.8;max-width:800px}.feedback .lesson{font-size:13px}.feedback-sources{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:17px}.feedback-sources a{font-size:11px;color:var(--green);text-decoration:underline;text-underline-offset:4px;display:inline-flex;align-items:center;gap:4px}.feedback-sources .ui-icon{width:12px;height:12px}.feedback-bottom{border-top:1px solid #d2dacf;margin-top:26px;padding-top:21px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.feedback-bottom small{color:var(--muted)}

  function mission(ch){
    const finished=state.answers.filter(a=>a.chapter===ch.id).length===3;

  }
  function game(){

  function intro(){return `<section class="intro-page"><div class="intro-index">ІС МАТЕРИАЛДАРЫ <span>01 — 12</span></div><div class="intro-symbol">${ico('search')}</div>${eyebrow('БАСТАУ','ШЕРҚАЛА ІСІ')}<h1>Дәлел іздеуге<br>дайынсың ба?</h1><p>Алдыңда 12 мәлімдеме бар. Әр істің құжаттарын ашып, мәліметтерді салыстырып, өз шешіміңді тіркей аласың.</p>${action('Бірінші істі ашу','start')}<div class="intro-footnote">12 іс · 4 бөлім · Әр дұрыс жауапқа 10 ұпай</div></section>`;}
  function gameTop(q){const ch=chapterOf(q.chapter);return `<div class="case-navigation">

  </div><div class="progress-segments" role="progressbar" aria-label="Ойын барысы" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${state.answers.length}">${Array.from({length:12},(_,i)=>`<span class="${i<state.answers.length?'progress-filled':''} ${i===q.id-1?'progress-current':''}"></span>`).join('')}</div><div class="progress-line"><span>ІС ${String(q.id).padStart(2,'0')} / 12</span><span>${state.answers.length} ТЕКСЕРІЛДІ</span></div>`;}
  function currentCase(){
    const q=D.cases[state.index];if(!q)return result();
    const answered=state.phase==='feedback';
    const a=answered?state.answers[state.answers.length-1]:null;

    const ready=viewed.length>0;
    return `${gameTop(q)}<div class="investigation-grid">
    <section class="dossier" aria-label="Тарихи мәлімдеме және дәлелдер">
      <div class="dossier-header"><div><span class="dossier-tab">ТЕКСЕРУ МАТЕРИАЛЫ</span><span class="dossier-id">№ ${String(q.id).padStart(3,'0')}</span></div><span class="category-tag">${esc(q.category)}</span></div>
      <h2>${esc(q.label)}</h2><div class="claim-title">ТЕКСЕРІЛЕТІН МӘЛІМДЕМЕ</div>
      <blockquote class="claim"><span class="claim-quote">“</span><p>${esc(q.claim)}</p></blockquote>

    </section>

    </aside></div>${answered?feedback(q,a):''}`;
  }
  function evidenceBlock(q,e,i){
    const opened=state.opened.includes(`${q.id}:${i}`);

    </article>`;
  }
  function feedback(q,a){
    const refs=q.sources.map(k=>`<a href="${D.sources[k].url}" target="_blank" rel="noopener noreferrer">${esc(D.sources[k].short)} ${ico('open')}</a>`).join('');

  }
  function completedChapter(){
    const idx=state.index/3-1;
    const ch=D.chapters[Math.max(0,idx)];

  }

    <section class="results-section">${eyebrow('01','БӨЛІМДЕР')}<h2>Қай тақырыпты жақсы білесің?</h2><div class="result-chapters">${D.chapters.map(ch=>{const ids=D.cases.filter(q=>q.chapter===ch.id).map(q=>q.id),cnt=state.answers.filter(a=>a.correct&&ids.includes(a.id)).length;return `<div><span>${ico(ch.icon)} ${esc(ch.name)}</span><strong>${cnt} / 3</strong></div>`;}).join('')}</div></section>
    <section class="results-section">${eyebrow('02','ТЕКСЕРУ ХАТТАМАСЫ')}<h2>Он екі істің қорытындысы</h2><div class="review-list">${D.cases.map(q=>{const a=state.answers.find(x=>x.id===q.id);return `<div class="review-item"><span class="review-no">${String(q.id).padStart(2,'0')}</span><div><strong>${esc(q.label)}</strong><small>Дұрыс шешім: ${labels[q.verdict]} · Сенің шешімің: ${labels[a?.verdict]||'—'}</small></div><span class="review-score ${a?.correct?'correct':'incorrect'}">${ico(a?.correct?'check':'x')} ${a?.correct?'+10':'0'}</span></div>`;}).join('')}</div>
    <div class="fine-note">${ico('info')}<span>Ойындағы ұпай — сенің жаттығуыңның нәтижесі. Ғылыми жобадағы үш ЖИ жүйесінің бағалары — бөлек зерттеудің нәтижесі.</span></div></section>`;

  function research(){

    if(state.opened.includes(key))state.opened=state.opened.filter(x=>x!==key);
    else{state.opened.push(key);if(!state.read.includes(key))state.read.push(key);}
    save();render();const b=document.querySelector(`[data-action="evidence"][data-index="${idx}"]`);b?.focus({preventScroll:true});
  }
  function answer(verdict){
    const q=D.cases[state.index];
    if(!q||state.phase!=='case'||!labels[verdict])return;
    if(!state.read.some(k=>k.startsWith(q.id+':'))){toast('Алдымен кемінде бір құжатты оқы.');return;}
    state.answers.push({id:q.id,verdict,correct:verdict===q.verdict,chapter:q.chapter,evidenceRead:state.read.filter(k=>k.startsWith(q.id+':')).length});
    state.phase='feedback';save();render();$('feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function next(){
    if(state.phase!=='feedback')return;
    if(state.index===11){state.index=12;state.phase='result';}
    else if(state.index%3===2){state.index++;state.phase='chapter';state.opened=[];}
    else{state.index++;state.phase='case';state.opened=[];}
    save();render();top();
  }
  function nextChapter(){if(state.phase!=='chapter')return;state.phase='case';save();render();top();}
  function reset(){if(!confirm('Тергеуді басынан бастайсың ба? Бұрынғы жауаптар мен ұпайлар өшеді.'))return;state=blank();save();nav('home');}
  function download(){
    if(state.phase!=='result')return;
    const rows=[['Іс','Бөлім','Мәлімдеме','Оқушы шешімі','Дұрыс шешім','Нәтиже (1/0)','Оқылған құжаттар']];
    D.cases.forEach(q=>{const a=state.answers.find(x=>x.id===q.id);rows.push([q.id,chapterOf(q.chapter).name,q.claim,labels[a.verdict],labels[q.verdict],a.correct?'1':'0',a.evidenceRead]);});
    rows.push(['БАРЛЫҒЫ','','','','',`${score()} / 120`,'']);
    const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=`Sherkala_tergeu_natyzhe_${new Date().toISOString().slice(0,10)}.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Нәтиже жүктелді.');
  }
  document.addEventListener('click', event=>{
    const n=event.target.closest('[data-nav]');if(n){event.preventDefault();nav(n.dataset.nav);return;}
    const b=event.target.closest('[data-action]');if(!b)return;
    const a=b.dataset.action;
    if(a==='start')start();else if(a==='resume')resume();else if(a==='evidence')toggleEvidence(Number(b.dataset.index));else if(a==='answer')answer(b.dataset.value);else if(a==='next')next();else if(a==='next-chapter')nextChapter();else if(a==='reset')reset();else if(a==='download')download();else if(a==='print')window.print();
  });
  render();
})();

</script></body>
</html>
